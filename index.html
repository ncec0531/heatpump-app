  .brand-tab.active { color: #185FA5; border-bottom-color: #185FA5; }

  .series-tab:hover { color: #1a1a18; }
  .series-tab.active { color: #185FA5; border-bottom-color: #185FA5; font-weight: 500; }

  /* Model selector */
  #model-wrap { padding: 14px 16px; border-bottom: 0.5px solid rgba(0,0,0,0.12); }
  #model-wrap label { font-size: 12px; color: #5f5e5a; display: block; margin-bottom: 4px; }
  #model-sel { width: 100%; font-size: 14px; font-family: inherit; padding: 9px 10px; border-radius: 8px; border: 0.5px solid rgba(0,0,0,0.25); background: #fff; color: #1a1a18; }

  /* Result */
  #result { padding: 16px; }
  .no-sel { text-align: center; padding: 3rem 1rem; color: #888780; font-size: 14px; }

  .series-badge { display: inline-block; font-size: 11px; padding: 3px 10px; border-radius: 20px; background: #E6F1FB; color: #0C447C; margin-bottom: 8px; font-weight: 500; }
  .model-note { font-size: 12px; color: #5f5e5a; margin-bottom: 14px; }
  .section-title { font-size: 11px; font-weight: 500; color: #888780; text-transform: uppercase; letter-spacing: 0.05em; margin: 14px 0 8px; }

  .spec-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .spec-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .spec-card { background: #f0ede6; border-radius: 8px; padding: 12px 14px; }
  .spec-label { font-size: 11px; color: #888780; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; }
  .spec-value { font-size: 20px; font-weight: 500; }
  .spec-value-sm { font-size: 14px; font-weight: 500; }
  .spec-unit { font-size: 12px; font-weight: 400; color: #888780; margin-left: 2px; }

  .info-row { display: flex; align-items: flex-start; gap: 10px; padding: 9px 12px; background: #f0ede6; border-radius: 8px; margin-bottom: 8px; font-size: 13px; }
  .info-icon { color: #888780; font-size: 16px; flex-shrink: 0; margin-top: 1px; }
  .info-label { color: #888780; font-size: 11px; display: block; margin-bottom: 1px; }

  .warn-icon { font-size: 15px; flex-shrink: 0; margin-top: 1px; }

    .spec-grid-3 .spec-card:last-child { grid-column: span 2; }

  document.querySelectorAll('.brand-tab').forEach(function(t) { t.classList.remove('active'); });
  event.target.classList.add('active');

  if (brand === 'myair') {
    document.getElementById('series-tabs').innerHTML = '';
    document.getElementById('model-wrap').style.display = 'none';
    document.getElementById('result').innerHTML = `
      <div class="series-badge">My Air — Installation Settings</div>

      <div class="section-title">Main menu (Middle button)</div>
      <div class="info-row"><span class="info-icon">&#x1F550;</span><div><span class="info-label">Step 1</span>Clock &amp; calendar &#x2192; Set time &amp; date</div></div>

      <div class="section-title">Configuration</div>
      <div class="info-row"><span class="info-icon">&#x1F5A5;</span><div><span class="info-label">Display &#x2192; Display mode</span>Set to <strong>Detailed</strong></div></div>

      <div class="section-title">Field settings</div>
      <div class="info-row"><span class="info-icon">&#x2699;</span><div><span class="info-label">Access</span>Hold down <strong>service setting button (bottom right) for 5 seconds</strong></div></div>

      <div class="section-title">Change field settings</div>
      <div class="spec-grid">
        <div class="spec-card"><div class="spec-label">20-2-03</div><div class="spec-value-sm">Read temp from controller</div></div>
        <div class="spec-card"><div class="spec-label">22-3-03</div><div class="spec-value-sm">Heating fan cycle off</div></div>
        <div class="spec-card" style="grid-column:span 2"><div class="spec-label">23-6-10</div><div class="spec-value-sm">Adjust static pressure up / down</div></div>
      </div>

      <div class="info-row" style="margin-top:8px"><span class="info-icon">&#x1F4BE;</span><div><span class="info-label">Save</span>Press <strong>bottom right button</strong> to save settings</div></div>

      <div class="section-title">Commissioning — Zone Control Ducted</div>
      <div class="info-row"><span class="info-icon">&#x2460;</span><div><span class="info-label">Step 1</span>Wire in Daikin wall controller</div></div>
      <div class="info-row"><span class="info-icon">&#x2461;</span><div><span class="info-label">Step 2</span>Change field settings</div></div>
      <div class="info-row"><span class="info-icon">&#x2462;</span><div><span class="info-label">Step 3</span>Wire in zone controller</div></div>
      <div class="info-row"><span class="info-icon">&#x2463;</span><div><span class="info-label">Step 4</span>Make sure dip switch 5 is <strong>OFF</strong> on black box</div></div>

      <div class="section-title">Touchscreen Setup</div>
      <div class="info-row"><span class="info-icon">&#x2460;</span><div><span class="info-label">Step 1</span>Tech set up — Run wizard</div></div>
      <div class="info-row"><span class="info-icon">&#x2461;</span><div><span class="info-label">Dealer password</span><strong>22369</strong></div></div>
      <div class="info-row"><span class="info-icon">&#x2462;</span><div><span class="info-label">Step 3</span>Select number of zones</div></div>
      <div class="info-row"><span class="info-icon">&#x2463;</span><div><span class="info-label">Step 4</span>Select <strong>0 constants</strong></div></div>
      <div class="info-row"><span class="info-icon">&#x2464;</span><div><span class="info-label">Step 5</span>Set zone names &amp; pair temp sensors</div></div>
      <div class="info-row"><span class="info-icon">&#x2465;</span><div><span class="info-label">Step 6</span>Set system to <strong>My Temp</strong></div></div>
      <div class="info-row"><span class="info-icon">&#x2466;</span><div><span class="info-label">Step 7</span>Set to show <strong>actual temp</strong></div></div>

      <div class="section-title">Commissioning Checks</div>
      <div class="info-row"><span class="info-icon">&#x2460;</span><div><span class="info-label">Step 1</span>Run system first on <strong>fan only</strong></div></div>
      <div class="info-row"><span class="info-icon">&#x2461;</span><div><span class="info-label">Step 2</span>Check zones are allocated correctly by turning on/off and checking airflow</div></div>
      <div class="info-row"><span class="info-icon">&#x2462;</span><div><span class="info-label">Step 3</span>Switch to heating/cooling &amp; check temps</div></div>
    `;
    return;
  }

  document.getElementById('model-wrap').style.display = '';
  activeSeries = Object.keys(DATA[brand].series)[0];
  renderSeriesTabs();
  renderModels();
  clearResult();
}

function selectSeries(s) {
  activeSeries = s;
  document.querySelectorAll('.series-tab').forEach(function(t) { t.classList.remove('active'); });
  document.getElementById('stab-' + s).classList.add('active');
  renderModels();
  clearResult();
}

function renderSeriesTabs() {
  if (activeBrand === 'myair') return;
  var container = document.getElementById('series-tabs');
  var series = DATA[activeBrand].series;
  var html = '';
  Object.keys(series).forEach(function(key) {
    var s = series[key];
    var active = key === activeSeries ? ' active' : '';
    var label = s.label.split(' -- ')[0].split(' — ')[0];
    html += '<button class="series-tab' + active + '" id="stab-' + key + '" onclick="selectSeries(\'' + key + '\')">' + label + '</button>';
  });
  container.innerHTML = html;
}

function renderModels() {
  if (activeBrand === 'myair') return;
  var models = DATA[activeBrand].series[activeSeries].models;
  var sel = document.getElementById('model-sel');
  var html = '<option value="">Select model&hellip;</option>';
  models.forEach(function(m) {
    html += '<option value="' + m.id + '">' + m.name + '</option>';
  });
  sel.innerHTML = html;
}

function clearResult() {
  document.getElementById('result').innerHTML = '<div class="no-sel">&#9757; Select a model above</div>';
}

function onModel() {
  var mid = document.getElementById('model-sel').value;
  if (!mid) { clearResult(); return; }
  if (activeBrand === 'myair') return;
  var seriesData = DATA[activeBrand].series[activeSeries];
  var m = null;
  seriesData.models.forEach(function(x) { if (x.id === mid) m = x; });
  if (!m) return;

  var isFloor = seriesData.type === 'Floor console';
  var isDucted = seriesData.type === 'Ceiling ducted';
  var isAccessory = seriesData.type === 'Accessory';
  var isOverseas = !!seriesData.overseas;
  var isThreePhase = !!m.threephase;

  var supply = isThreePhase ? '380-415V / 50Hz / 3ph' : '230V / 50Hz / 1ph';

  var html = '';
  html += '<div class="series-badge">' + seriesData.label + '</div>';
  html += '<p class="model-note">' + m.ref + '</p>';

  if (isAccessory && m.wifi) {
    html += '<div class="section-title">Compatible models</div>';
    html += '<div class="info-row"><span class="info-icon">&#10003;</span><div><span class="info-label">Suits</span>' + m.compatible + '</div></div>';
    html += '<div class="section-title">Notes</div>';
    html += '<div class="warn warn-blue"><span class="warn-icon">&#8505;</span><span>' + m.notes + '</span></div>';
    document.getElementById('result').innerHTML = html;
    return;
  }

  html += '<div class="section-title">Electrical requirements</div>';
  html += '<div class="spec-grid">';
  html += '<div class="spec-card"><div class="spec-label">Cable size</div><div class="spec-value-sm">' + m.cable + '</div></div>';
  html += '<div class="spec-card"><div class="spec-label">Circuit breaker</div><div class="spec-value">' + m.breaker + '<span class="spec-unit">A</span></div></div>';
  html += '<div class="spec-card"><div class="spec-label">Isolator</div><div class="spec-value-sm">' + m.isolator + '</div></div>';
  html += '<div class="spec-card"><div class="spec-label">Supply</div><div class="spec-value-sm">' + supply + '</div></div>';
  html += '</div>';

  html += '<div class="section-title">Capacity</div>';
  html += '<div class="spec-grid">';
  html += '<div class="spec-card"><div class="spec-label">Cooling</div><div class="spec-value">' + m.cool + '<span class="spec-unit">kW</span></div></div>';
  html += '<div class="spec-card"><div class="spec-label">Heating</div><div class="spec-value">' + m.heat + '<span class="spec-unit">kW</span></div></div>';
  html += '</div>';

  html += '<div class="section-title">Pipework</div>';
  html += '<div class="info-row"><span class="info-icon">&#9679;</span><div><span class="info-label">Liquid line</span>' + m.liquid + '</div></div>';
  html += '<div class="info-row"><span class="info-icon">&#9679;</span><div><span class="info-label">Suction line</span>' + m.suction + '</div></div>';
  if (!isFloor && !isDucted) {
    html += '<div class="info-row"><span class="info-icon">&#9638;</span><div><span class="info-label">Wall penetration</span>65mm core hole</div></div>';
  }
  html += '<div class="info-row"><span class="info-icon">&#10052;</span><div><span class="info-label">Refrigerant</span>R32</div></div>';

  html += '<div class="section-title">Refrigerant pipe run</div>';
  html += '<div class="spec-grid-3">';
  html += '<div class="spec-card"><div class="spec-label">Pre-charged length</div><div class="spec-value">' + m.preCharged + '<span class="spec-unit">m</span></div></div>';
  html += '<div class="spec-card"><div class="spec-label">Maximum pipe run</div><div class="spec-value">' + m.maxPipe + '<span class="spec-unit">m</span></div></div>';
  html += '<div class="spec-card"><div class="spec-label">Additional charge</div><div class="spec-value-sm">' + m.chargeRate + 'g<span class="spec-unit">/m</span><div style="font-size:11px;color:#888780;margin-top:3px">beyond ' + m.preCharged + 'm</div></div></div>';
  html += '</div>';

  if (m.indoorDims && m.outdoorDims) {
    html += '<div class="section-title">Unit dimensions (H x W x D)</div>';
    html += '<div class="spec-grid">';
    html += '<div class="spec-card"><div class="spec-label">Indoor unit</div><div class="spec-value-sm">' + m.indoorDims + '</div></div>';
    html += '<div class="spec-card"><div class="spec-label">Outdoor unit</div><div class="spec-value-sm">' + m.outdoorDims + '</div></div>';
    html += '</div>';
  }

  if (!isFloor && !isDucted) {
    html += '<div class="warn warn-blue"><span class="warn-icon">&#8505;</span><span><strong>Indoor mounting height:</strong> Install so the top of the indoor unit is no lower than 2250mm. If possible mount indoor unit no less than 100mm from ceiling. Install indoor unit parallel with ceiling. If the indoor unit is being installed on a higher wall, mount as low as practicable.</span></div>';
  }
  if (!isDucted) {
    html += '<div class="warn warn-blue"><span class="warn-icon">&#8505;</span><span><strong>Pipe exit:</strong> Where pipes exit the building to the outdoor unit, bring them through the wall a minimum of 500mm up from the slab. Where possible, bring the pipes out behind the outdoor unit.</span></div>';
  }
  if (isDucted) {
    html += '<div class="warn warn-blue"><span class="warn-icon">&#8505;</span><span><strong>Wall controller:</strong> Mount centre of controller at 1500mm from finished floor level.</span></div>';
  }
  if (isOverseas) {
    html += '<div class="warn warn-amber"><span class="warn-icon">&#9888;</span><span>Ambi QCE is newly released in NZ. Specs based on international data &mdash; always verify against the supplied NZ installation manual.</span></div>';
  }
  if (isThreePhase) {
    html += '<div class="warn warn-amber"><span class="warn-icon">&#9888;</span><span><strong>3 Phase supply required:</strong> This unit requires 3 phase 380-415V / 50Hz power supply. Confirm 3 phase is available before installation.</span></div>';
  }

  document.getElementById('result').innerHTML = html;
}

// Init
renderSeriesTabs();
renderModels();
</script>

  window.addEventListener('load', function() {
    navigator.serviceWorker.register('sw.js').then(function(reg) {
      console.log('SW registered');
    }).catch(function(err) {
      console.log('SW failed: ', err);
    });
  });
}
</script>
</body>
</html>
